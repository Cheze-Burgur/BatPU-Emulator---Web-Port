<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CPU simulation</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts Symbol Library -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=play_pause,replay,download,upload" />
</head>

<body>
    <div id="app">

        <div id="mobile-nav" class="closed" aria-label="Mobile navigation">
            <div id="mobile-nav-handle" aria-label="Toggle mobile navigation">
                <span></span>
            </div>

            <div id="mobile-nav-content">
                <div id="mobile-nav-buttons">
                    <button type="button" class="mobile-nav-panel-button active" data-panel="left">I/O</button>
                    <button type="button" class="mobile-nav-panel-button" data-panel="center">Control</button>
                    <button type="button" class="mobile-nav-panel-button" data-panel="right">Editor</button>
                </div>

                <div class="mobile-nav-actions" aria-label="Utility buttons">
                    <button type="button" class="mobile-nav-action-button" data-action="isa">ISA</button>
                    <button type="button" class="mobile-nav-action-button" data-action="io">I/O</button>
                    <button type="button" class="mobile-nav-action-button" data-action="help">Help</button>
                    <button type="button" class="mobile-nav-action-button" data-action="presets">Presets</button>
                    <button type="button" class="mobile-nav-action-button" data-action="about">About</button>
                    <button type="button" class="mobile-nav-action-button" data-action="changelog">Changelog</button>
                    <button type="button" class="mobile-nav-action-button" data-action="settings">Settings</button>
                    <button type="button" class="mobile-nav-action-button" data-action="project-repo">Project
                        Repository</button>
                </div>
            </div>
        </div>

        <div id="workspace">

            <!-- I/O Panel -->
            <div class="panel" id="left">
                <div class="section">
                    <div class="section-header">Output Devices</div>
                    <div id="output-wrap">
                        <div id="output-row">
                            <div id="text-display">
                                <!-- Max length - 10 chars -->
                            </div>
                            <div id="num-display">
                                <!-- Max # of digits - 3 -->
                                <!-- Max # of digits (signed) - 4 -->
                            </div>
                        </div>

                        <div id="grid-display">
                            <div id="pixel-grid">
                                <!-- 32x32 -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">Input Controller</div>
                    <div id="input-wrap">
                        <div id="dpad-wrap">
                            <button id="btn-up">⌃</button>
                            <button id="btn-lft">‹</button>
                            <button id="btn-rgt">›</button>
                            <button id="btn-dwn">⌄</button>
                        </div>

                        <div id="ctr-btns-wrap">
                            <button id="ctr-btn-one">1</button>
                            <button id="ctr-btn-two">2</button>
                        </div>

                        <div id="rgt-btns-wrap">
                            <button id="ctr-btn-a">A</button>
                            <button id="ctr-btn-b">B</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control/Memory Panel -->
            <div class="panel" id="center">
                <div class="section">
                    <div class="section-header">CONTROL</div>
                    <div id="control-wrap">
                        <div id="control-buttons">
                            <button id="clock-toggle"><span class="material-symbols-outlined">play_pause</span>Run</button>
                            <button id="line-step">Step Inst</button>
                            <button id="reset-program"><span class="material-symbols-outlined">replay</span>Reset</button>
                            <button id="save-program"><span class="material-symbols-outlined">download</span>Save</button>
                            <button id="load-program"><span class="material-symbols-outlined">upload</span>Load</button>
                        </div>

                        <div id="speed-control">
                            <div id="speed-header">
                                <span>Execution Rate</span>
                                <span id="speed-value">100 Hz</span>
                            </div>

                            <input id="program-speed-slider" name="speed" type="range" min="1" max="10000" step="1"
                                value="500" list="markers">

                            <datalist id="markers">
                                <option value="1"></option>
                                <option value="2500"></option>
                                <option value="5000"></option>
                                <option value="7500"></option>
                                <option value="10000"></option>
                            </datalist>
                        </div>

                        <div id="cpu-status-bar">
                            <div>
                                STATUS:
                                <span id="cpu-status-text" class="status-running">
                                    HALTED
                                </span>
                            </div>

                            <div>PC: ----</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">FLAGS</div>
                    <div id="flags-panel">

                        <div id="flags-wrap">
                            <div class="flag-box" id="flag-zero">
                                <div class="flag-label">Z</div>
                                <div class="flag-value">0</div>
                            </div>

                            <div class="flag-box" id="flag-carry">
                                <div class="flag-label">C</div>
                                <div class="flag-value">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">CALL STACK</div>
                    <div id="stack-panel">
                        <div id="stack-display-wrap">
                            <div class="stack-box" id="stack-size">
                                <div class="stack-label">Stack Size:</div>
                                <div class="stack-value">0</div>
                            </div>

                            <div class="stack-box" id="stack-top">
                                <div class="stack-label">Top of Stack:</div>
                                <div class="stack-value">----------</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">REGISTERS & MEMORY</div>
                    <div id="memory-display-wrap">
                        <div id="reg-file-display"></div>

                        <div id="data-memory-display"></div>
                    </div>
                </div>
            </div>

            <!-- Program Panel -->
            <div class="panel" id="right">
                <div class="section-header">ASSEMBLY EDITOR</div>
                <div class="editor-shell">
                    <div id="editor-gutter" class="editor-gutter" aria-hidden="true"></div>
                    <div class="editor-text-area">
                        <textarea id="code-editor" spellcheck="false"># Enter a program or load a preset.</textarea>
                    </div>
                </div>

                <button id="mobile-problems-button" class="mobile-editor-problems-button" type="button">
                    Problems (0)
                </button>
            </div>

        </div>

        <div id="bottom-panel">

            <div id="bottom-toolbar">

                <button id="problems-toggle">
                    Problems (0)
                </button>

                <div id="bottom-buttons">

                    <button id="isa-button">
                        ISA
                    </button>

                    <button id="io-button">
                        I/O
                    </button>

                    <button id="help-button">
                        Help
                    </button>

                    <button id="presets-button">
                        Presets
                    </button>

                    <button id="about-button">
                        About
                    </button>

                    <button id="changelog-button">
                        Changelog
                    </button>

                    <button id="settings-button">
                        Settings
                    </button>

                    <button id="project-repo-button">
                        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56
                            0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.28-1.69-1.28-1.69
                            -1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.69 1.26
                            3.35.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69
                            0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31
                            3.18 1.18a11.06 11.06 0 0 1 5.79 0c2.21-1.5 3.18-1.18
                            3.18-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19
                            3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.08.78 2.18
                            0 1.57-.01 2.84-.01 3.22 0 .31.21.68.8.56A11.51 11.51
                            0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
                        </svg>
                        
                        Project Repository
                    </button>

                </div>

            </div>

            <div id="problems-panel">

                <div id="problems-list">

                    No problems.

                </div>

            </div>

        </div>

        <div id="modal-overlay" class="hidden">

            <div id="modal-window">

                <div id="modal-header">

                    <span id="modal-title">Documentation</span>

                    <button id="modal-close">✕</button>

                </div>

                <div id="modal-body">

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
